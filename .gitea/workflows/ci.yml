# Gitea Actions 质量门禁（对应 issue.md TEST-01）
#
# 触发：push 与 pull_request。
# 前置：Gitea 侧需已部署 act_runner 且带 `ubuntu-latest` 标签；未配置时本文件不会执行，
#       本地可用 `scripts/blog.sh install-hooks` 启用等效的 pre-push 门禁。
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: 后端（ruff / mypy / 迁移 / pytest）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖（runtime + dev 组）
        run: uv sync --frozen

      - name: Lint（ruff）
        run: uv run ruff check .

      - name: 类型检查（mypy）
        run: uv run mypy config articles common users

      - name: 迁移一致性（不得存在未生成的迁移）
        run: uv run python manage.py makemigrations --check --dry-run

      - name: 测试（pytest）
        run: uv run pytest -q

  frontend:
    name: 前端（vue-tsc / vitest）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json

      # postinstall 会执行 `nuxt prepare`，生成 vue-tsc 需要的 .nuxt/tsconfig.json
      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 类型检查（vue-tsc）
        run: npx vue-tsc --noEmit

      - name: 单元测试（vitest）
        run: npm test