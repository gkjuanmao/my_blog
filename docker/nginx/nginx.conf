server {
    listen 18080;
    server_name _;

    # 支持大文件上传（封面 20MB + 附件 50MB，含 multipart 边界开销）
    client_max_body_size 60m;

    # 响应压缩
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
        application/xml application/xml+rss image/svg+xml;

    # 静态文件：由 collectstatic 收集至 /staticfiles/，开启 7 天缓存
    location /static/ {
        alias /staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 媒体文件：直接 alias 到本地目录，开启 7 天缓存
    location /media/ {
        alias /media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # API 接口：反向代理到 Django
    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin 后台：反向代理到 Django
    location /admin/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端 Nuxt SSR：反代到 front 服务
    location / {
        proxy_pass http://front:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
