# 说明：本文件被挂载到 /etc/nginx/conf.d/default.conf，位于 http{} 之内，
# 因此下面的 limit_req_zone / limit_conn_zone 可以放在文件顶部。

# 归档接口限流：1 请求/秒，突发 5；并发连接 2（导入是重操作，不能被打满）
limit_req_zone  $binary_remote_addr zone=archive:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=archive_conn:10m;

server {
    listen 18888;
    server_name _;

    # 普通接口的上传上限：封面 20MB + 附件 50MB，含 multipart 边界开销
    client_max_body_size 60m;
    # 大文件上传缓冲落在挂载卷上（避免写满容器 overlay）；默认值即此路径，显式声明便于对照
    client_body_temp_path /var/cache/nginx/client_temp;

    # 响应压缩
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
        application/xml application/xml+rss image/svg+xml;
    # 注意：application/zip 不在列表里 —— 归档包不应被二次压缩

    # 静态文件：由 collectstatic 收集至 /staticfiles/，开启 7 天缓存
    location /static/ {
        alias /staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 媒体文件：直接 alias 到本地目录，开启 7 天缓存
    location /media/ {
        alias /media/;
        expires 7d;
        add_header Cache-Control "public";
        # 媒体由 nginx 直出、不经过 Django，所以 nosniff 要在这一层补
        add_header X-Content-Type-Options "nosniff" always;
    }

    # D19 之前的存量 HTML 附件兜底：强制下载（正则 location 优先于前缀 location）
    # ⚠️ 必须是捕获式正则 + alias .../$1；写成 glob 或不带 alias 会 404/301（实测）
    location ~* ^/media/files/(.+\.(html?|xhtml))$ {
        alias /media/files/$1;
        expires 7d;
        add_header Cache-Control "public";
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 归档导出：生成可能较慢，必须单独放大超时，否则 60s 默认值会 504 并留下孤儿产物
    location /api/v1/admin/articles/export/ {
        limit_req zone=archive burst=5 nodelay;
        proxy_pass http://app:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # 归档导入：放大体积与超时。
    # ⚠️ proxy_set_header 不会从兄弟 location 继承，必须逐条重复
    location /api/v1/admin/articles/import/ {
        client_max_body_size 1g;
        client_body_timeout 300s;
        limit_req zone=archive burst=5 nodelay;
        limit_conn archive_conn 2;
        proxy_pass http://app:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 保留请求缓冲：不要把客户端上传速度绑到 worker 的超时预算上
        proxy_request_buffering on;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # 一次性票据下载（含 reissue 子路径）：票据在 URL 路径里，
    # 因此该 location 关闭 access log，避免票据被写进日志；并禁掉响应缓冲。
    # ⚠️ 正则里含 `{36}` 的 { } 会被 nginx 当成块定界符解析，**必须加引号**
    #   （否则 nginx 启动直接报 unknown directive "36}/"）
    location ~ "^/api/v1/admin/archives/[0-9a-f-]{36}/" {
        access_log off;
        proxy_pass http://app:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        add_header Referrer-Policy "no-referrer" always;
    }

    # API 接口：反向代理到 Django
    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin 后台：反向代理到 Django
    location /admin/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端 Nuxt SSR：反代到 front 服务
    location / {
        proxy_pass http://front:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
