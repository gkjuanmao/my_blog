services:
  app:
    build: .
    env_file:
      - .env
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
      - ./db_data:/app/db_data

  nginx:
    image: nginx:1.27
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/staticfiles
      - media:/media
    ports:
      - "80:80"
    depends_on:
      - app

volumes:
  staticfiles:
  media:
