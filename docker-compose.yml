services:
  db:
    image: postgres:16
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

  app:
    build: .
    env_file:
      - .env
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:1.27
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/staticfiles
      - media:/media
    ports:
      - "80:80"
    depends_on:
      - app

volumes:
  postgres_data:
  staticfiles:
  media:
