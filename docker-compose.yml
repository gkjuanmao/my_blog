services:
  app:
    build: .
    # 显式声明镜像名：podman 会规范化为 localhost/my_blog_app:latest，docker 直接用该名；
    # 离线包导出/导入依赖这个名字可预期（脚本会按引擎自动换算与补标签）
    image: my_blog_app:latest
    # 容器崩溃或宿主重启后自愈（OPS-01）
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 跨进程共享缓存（导入锁 / 登录失败限流 / 票据辅助）。
      # 未设置时 prod 会回落到进程内缓存并打警告：多 worker 下锁只在各自进程内有效。
      - REDIS_URL=redis://redis:6379/0
      # 归档产物与上传暂存目录（必须在挂载卷上，且不得位于对外服务的 media/static 下）
      - ARCHIVE_ROOT=/app/private_archives
      - FILE_UPLOAD_TEMP_DIR=/app/tmp
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
      # :z 是 SELinux 重新打标签（Fedora 默认 Enforcing，否则容器内无权限读写）
      - ./db_data:/app/db_data:z
      - archives:/app/private_archives
      - apptmp:/app/tmp
    # 就绪探活：容器内无 curl，用 Python 直接打公开接口（OPS-02）
    # start_period 留足首次启动 migrate/collectstatic 的时间
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/articles/', timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    # 仅作缓存/锁使用，不需要持久化
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # 容器崩溃或宿主重启后自愈（OPS-01）
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 归档导入任务的执行进程（见 DESIGN 5.3.6）。
  # 与 app 同镜像、同卷、不同 command：导入是分钟级长任务，放在请求线程里会占着
  # HTTP 连接（前端 15s 超时先报「网络错误」），放在 app 容器后台则收不到 SIGTERM。
  #
  # ⚠️ 必须单副本：串行执行、回滚包顺序、导入锁都建立在「全局只有一个执行者」上。
  #    不要 docker compose up --scale worker=2。
  worker:
    build: .
    image: my_blog_app:latest
    command: ["python", "manage.py", "import_worker"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 迁移/collectstatic/清扫由 app 容器独占执行，worker 跳过（见 entrypoint.sh）
      - SKIP_MIGRATE=1
      - REDIS_URL=redis://redis:6379/0
      - ARCHIVE_ROOT=/app/private_archives
      - FILE_UPLOAD_TEMP_DIR=/app/tmp
    volumes:
      # 必须与 app 完全一致：暂存包在 archives 卷、封面/附件落 media 卷、
      # 任务表与文章在同一份 db_data 上——少挂一个就报「暂存包不存在」。
      - media:/app/media
      - ./db_data:/app/db_data:z
      - archives:/app/private_archives
      - apptmp:/app/tmp
    depends_on:
      # 等 app 的 migrate 跑完（healthcheck start_period 60s 已覆盖首次启动）
      app:
        condition: service_healthy
      redis:
        condition: service_started
    # 默认 10s 不够把「任务被中断」的状态写完
    stop_grace_period: 30s

  nginx:
    image: nginx:1.27
    volumes:
      # :ro,z = 只读 + SELinux 重新打标签（否则容器内读不到该配置）
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
      - staticfiles:/staticfiles
      - media:/media
      # 大文件上传缓冲目录（默认就在此路径，挂卷避免写满容器 overlay）
      - nginxtmp:/var/cache/nginx/client_temp
    ports:
      - "18888:18888"
    # 容器崩溃或宿主重启后自愈（OPS-01）
    restart: unless-stopped
    # 等 app 真正就绪再起 nginx，避免 app 未起时报 502（OPS-02）
    depends_on:
      app:
        condition: service_healthy
      front:
        condition: service_started

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    image: my_blog_front:latest
    environment:
      - NUXT_PUBLIC_API_BASE=/api/v1/
    # 容器崩溃或宿主重启后自愈（OPS-01）
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

volumes:
  staticfiles:
  media:
  archives:
  apptmp:
  nginxtmp:
