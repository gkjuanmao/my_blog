services:
  app:
    build: .
    env_file:
      - .env
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
      - ./db_data:/app/db_data

  nginx:
    image: nginx:1.27
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/staticfiles
      - media:/media
    ports:
      - "18080:18080"
    depends_on:
      - app
      - front

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    environment:
      - NUXT_PUBLIC_API_BASE=/api/v1/
    depends_on:
      - app

volumes:
  staticfiles:
  media:
