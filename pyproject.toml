[project]
name = "my-blog"
version = "0.1.0"
description = "A Django-based personal blog."
requires-python = ">=3.12"
dependencies = [
    "django>=6.0",
    "django-cors-headers>=4.4",
    "django-ninja>=1.3",
    "django-ninja-jwt>=5.4.5",
    "django-unfold>=0.103.0",
    "djangorestframework-simplejwt>=5.5.1",
    "gunicorn>=23.0",
    "markdown>=3.6",
    "nh3>=0.2.17",
    "pillow>=10.0",
    "pypinyin>=0.55.0",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.0.9",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.13.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "venv", "migrations", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["articles", "common", "config", "users"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
mypy_path = "."
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "config.settings"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-v --tb=short"
testpaths = ["tests"]
